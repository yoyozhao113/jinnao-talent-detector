<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>劲脑·天赋探测仪 - 管理后台</title>
  <style>
    /* ========== Reset & Base (内联，生产自包含) ========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0a0e27;
      background-image:
        radial-gradient(ellipse at 15% 25%, rgba(124, 140, 240, 0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 75%, rgba(240, 192, 64, 0.04) 0%, transparent 50%);
      color: #e8eaff;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6;
    }
    input, button, select, textarea { font-family: inherit; }

    /* ========== Admin 基础样式 ========== */
    .admin-page { max-width: 700px; margin: 0 auto; padding: 20px 16px; }
    .admin-header { text-align: center; padding: 20px 0; }
    .admin-header h1 { font-size: 1.3rem; color: #f0c040; }
    .admin-login { text-align: center; padding: 40px 0; }
    .admin-login input {
      width: 80%; max-width: 300px; padding: 12px 16px; border-radius: 10px;
      border: 1px solid #1e2954; background: #0d1233; color: #e8eaff;
      font-size: 0.95rem; outline: none; margin-bottom: 12px;
    }
    .admin-login input:focus { border-color: #f0c040; }
    .admin-login button {
      background: linear-gradient(135deg, #f0c040, #e09e30); color: #0a0e27;
      border: none; border-radius: 10px; padding: 12px 40px; font-size: 1rem;
      font-weight: 600; cursor: pointer;
    }
    .admin-stats { display: flex; gap: 12px; margin-bottom: 16px; }
    .admin-stat { flex: 1; background: #111638; border-radius: 10px; padding: 12px; text-align: center; border: 1px solid #1e2954; }
    .admin-stat-num { font-size: 1.4rem; font-weight: 700; color: #f0c040; }
    .admin-stat-label { font-size: 0.75rem; color: #575a85; margin-top: 2px; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .admin-tab {
      padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; cursor: pointer;
      border: 1px solid transparent; color: #575a85; transition: all 0.2s;
    }
    .admin-tab:hover { color: #8b8fbd; border-color: #1e2954; }
    .admin-tab.active { background: rgba(240, 192, 64, 0.1); color: #f0c040; border-color: rgba(240, 192, 64, 0.3); }
    .admin-comment-item {
      background: #111638; border: 1px solid #1e2954; border-radius: 10px;
      padding: 14px; margin-bottom: 10px;
    }
    .admin-comment-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 4px; }
    .admin-comment-name { font-weight: 600; color: #e8eaff; font-size: 0.85rem; }
    .admin-comment-type { font-size: 0.72rem; color: #575a85; background: rgba(255,255,255,0.02); padding: 2px 8px; border-radius: 10px; }
    .admin-comment-time { font-size: 0.72rem; color: #575a85; }
    .admin-comment-content { font-size: 0.85rem; line-height: 1.7; color: #8b8fbd; margin-bottom: 8px; }
    .admin-comment-actions { display: flex; gap: 8px; }
    .admin-btn-approve, .admin-btn-delete { padding: 6px 14px; border: none; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }
    .admin-btn-approve { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
    .admin-btn-delete { background: rgba(248, 113, 113, 0.15); color: #f87171; }
    .admin-empty { text-align: center; color: #575a85; padding: 40px 0; font-size: 0.85rem; }
    .admin-loading { text-align: center; color: #575a85; padding: 40px 0; font-size: 0.85rem; }

    /* ========== 分销管理样式 ========== */
    .admin-tab.dist { color: #f59e0b; }
    .dist-admin-section { margin-bottom: 20px; }
    .dist-admin-section h3 { color: #e8eaff; font-size: 0.95rem; margin: 0 0 10px; }
    .dist-admin-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    .dist-admin-table th {
      text-align: left;
      padding: 6px 8px;
      color: #575a85;
      border-bottom: 1px solid #1e2954;
      font-weight: 500;
    }
    .dist-admin-table td {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(30,41,84,0.5);
      color: #c8c6e0;
    }
    .dist-admin-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.65rem;
    }
    .dist-admin-badge.active { background: rgba(102,187,106,0.2); color: #66bb6a; }
    .dist-admin-badge.disabled { background: rgba(239,83,80,0.2); color: #ef5350; }
    .dist-admin-badge.pending { background: rgba(245,158,11,0.2); color: #f59e0b; }
    .dist-admin-badge.confirmed { background: rgba(102,187,106,0.2); color: #66bb6a; }
    .dist-admin-badge.cancelled { background: rgba(239,83,80,0.2); color: #ef5350; }
    .dist-admin-badge.approved { background: rgba(102,187,106,0.2); color: #66bb6a; }
    .dist-admin-badge.rejected { background: rgba(239,83,80,0.2); color: #ef5350; }
    .dist-admin-actions { display: flex; gap: 4px; }
    .dist-admin-btn {
      padding: 2px 8px;
      border-radius: 4px;
      border: none;
      font-size: 0.65rem;
      cursor: pointer;
    }
    .dist-admin-btn.confirm { background: rgba(102,187,106,0.2); color: #66bb6a; }
    .dist-admin-btn.cancel { background: rgba(239,83,80,0.2); color: #ef5350; }
    .dist-admin-btn.approve { background: rgba(102,187,106,0.2); color: #66bb6a; }
    .dist-admin-btn.reject { background: rgba(239,83,80,0.2); color: #ef5350; }
    .dist-admin-stats {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .dist-admin-stat {
      background: #111638;
      border: 1px solid #1e2954;
      border-radius: 8px;
      padding: 10px 16px;
      text-align: center;
      flex: 1;
    }
    .dist-admin-stat-num { font-size: 1.2rem; font-weight: 700; color: #f59e0b; }
    .dist-admin-stat-label { font-size: 0.65rem; color: #575a85; margin-top: 2px; }
    .dist-admin-note-input {
      background: #0d1233;
      border: 1px solid #1e2954;
      border-radius: 4px;
      padding: 2px 6px;
      color: #e8eaff;
      font-size: 0.65rem;
      width: 80px;
      outline: none;
    }
    .dist-admin-note-input:focus { border-color: #f59e0b; }
    .dist-admin-config {
      background: #111638;
      border: 1px solid #1e2954;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .dist-admin-config h3 { color: #e8eaff; font-size: 0.95rem; margin: 0 0 16px; }
    .dist-admin-config-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .dist-admin-config-row label { color: #8b8fbd; font-size: 0.8rem; min-width: 100px; }
    .dist-admin-config-row input {
      flex: 1;
      background: #0d1233;
      border: 1px solid #1e2954;
      border-radius: 6px;
      padding: 8px 10px;
      color: #e8eaff;
      font-size: 0.9rem;
      outline: none;
      max-width: 160px;
    }
    .dist-admin-config-row input:focus { border-color: #f59e0b; }
    .dist-admin-config-hint { color: #575a85; font-size: 0.65rem; margin-top: 2px; }
    .dist-admin-config .current { color: #66bb6a; font-weight: 600; }
    .dist-admin-config .btn-save-config {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0a0e27;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    /* ========== 埋点统计样式 ========== */
    .track-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .track-card { background: #111638; border: 1px solid #1e2954; border-radius: 10px; padding: 12px; }
    .track-card.full { grid-column: 1 / -1; }
    .track-card h3 { font-size: 0.8rem; color: #575a85; margin-bottom: 8px; }
    .track-num { font-size: 1.6rem; font-weight: 700; color: #7c8cf0; }
    .track-num-small { font-size: 1rem; font-weight: 600; color: #f0c040; }
    .track-bar-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 0.75rem; }
    .track-bar-label { color: #8b8fbd; min-width: 80px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-bar-bg { flex: 1; height: 16px; background: #0d1233; border-radius: 4px; overflow: hidden; }
    .track-bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }
    .track-bar-fill.page { background: linear-gradient(90deg, #7c8cf0, #5a6bd8); }
    .track-bar-fill.section { background: linear-gradient(90deg, #f0c040, #e09e30); }
    .track-bar-fill.event { background: linear-gradient(90deg, #66bb6a, #43a047); }
    .track-bar-count { color: #c8c6e0; min-width: 30px; text-align: left; font-size: 0.72rem; }
    .track-day-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 0.72rem; }
    .track-day-label { color: #575a85; min-width: 60px; }
    .track-day-bg { flex: 1; height: 14px; background: #0d1233; border-radius: 4px; overflow: hidden; }
    .track-day-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #7c8cf0, #f0c040); }
    .track-day-count { color: #c8c6e0; min-width: 30px; }
    .track-empty { text-align: center; color: #575a85; padding: 30px 0; font-size: 0.8rem; }
  </style>
  <script>
    const ADMIN_KEY = 'momadmin888';
    let currentTab = 'pending';
    let currentDistTab = 'distributors';

    async function api(path, options = {}) {
      const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
      return res.json();
    }

    async function login() {
      const key = document.getElementById('admin-key').value;
      if (key !== ADMIN_KEY) { document.getElementById('login-error').textContent = '密钥错误'; return; }
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      loadComments();
      loadDistributorData();
    }

    // ========== 评论管理 ==========
    async function loadComments() {
      const data = await api('/api/comments?admin=1&key=' + ADMIN_KEY);
      if (!data.success) return;
      const comments = data.data || [];
      const pending = comments.filter(c => !c.approved);
      const approved = comments.filter(c => c.approved);

      document.getElementById('stat-pending').textContent = pending.length;
      document.getElementById('stat-approved').textContent = approved.length;
      document.getElementById('stat-total').textContent = comments.length;

      const list = document.getElementById('comment-list');
      const items = currentTab === 'pending' ? pending : (currentTab === 'approved' ? approved : comments);

      if (!items.length) {
        list.innerHTML = '<div class="admin-empty">暂无评论</div>';
        return;
      }

      list.innerHTML = items.map(c => `
        <div class="admin-comment-item">
          <div class="admin-comment-meta">
            <div>
              <span class="admin-comment-name">${escHtml(c.name)}</span>
              <span class="admin-comment-type">${c.reportType === 'star' ? '星盘' : '性格测试'}</span>
            </div>
            <span class="admin-comment-time">${new Date(c.createdAt).toLocaleString('zh-CN')}</span>
          </div>
          <div class="admin-comment-content">${escHtml(c.content)}</div>
          <div class="admin-comment-actions">
            ${!c.approved ? `<button class="admin-btn-approve" onclick="approveComment('${c.id}')">✓ 通过</button>` : ''}
            <button class="admin-btn-delete" onclick="deleteComment('${c.id}')">✕ 删除</button>
          </div>
        </div>
      `).join('');
    }

    async function approveComment(id) {
      await api('/api/comments?action=approve&key=' + ADMIN_KEY, {
        method: 'POST', body: JSON.stringify({ id })
      });
      loadComments();
    }

    async function deleteComment(id) {
      if (!confirm('确定删除这条评论？')) return;
      await api('/api/comments?action=delete&key=' + ADMIN_KEY, {
        method: 'POST', body: JSON.stringify({ id })
      });
      loadComments();
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      if (tab === 'dist') {
        loadDistributorData();
      } else {
        loadComments();
      }
    }

    // ========== 分销管理 ==========
    async function loadDistributorData() {
      const [distRes, ordersRes, wdRes] = await Promise.all([
        api('/api/distributor/admin/list?key=' + ADMIN_KEY),
        api('/api/distributor/admin/orders?key=' + ADMIN_KEY),
        api('/api/distributor/admin/withdrawals?key=' + ADMIN_KEY)
      ]);

      const distContainer = document.getElementById('dist-admin-content');
      if (!distContainer) return;

      const distributors = distRes.distributors || [];
      const orders = ordersRes.orders || [];
      const withdrawals = wdRes.withdrawals || [];

      const pendingOrders = orders.filter(o => o.status === 'pending');
      const pendingWd = withdrawals.filter(w => w.status === 'pending');
      const totalCommission = orders.filter(o => o.status === 'confirmed').reduce((s, o) => s + o.commission, 0);
      const pendingCommission = pendingOrders.reduce((s, o) => s + o.commission, 0);

      let html = `
        <div class="dist-admin-stats">
          <div class="dist-admin-stat"><div class="dist-admin-stat-num">${distributors.length}</div><div class="dist-admin-stat-label">推广员</div></div>
          <div class="dist-admin-stat"><div class="dist-admin-stat-num">${pendingOrders.length}</div><div class="dist-admin-stat-label">待确认</div></div>
          <div class="dist-admin-stat"><div class="dist-admin-stat-num">${pendingWd.length}</div><div class="dist-admin-stat-label">待提现</div></div>
          <div class="dist-admin-stat"><div class="dist-admin-stat-num">¥${totalCommission.toFixed(1)}</div><div class="dist-admin-stat-label">已发佣金</div></div>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
          <span class="admin-tab ${currentDistTab === 'distributors' ? 'active' : ''} dist" onclick="switchDistTab('distributors')">推广员 (${distributors.length})</span>
          <span class="admin-tab ${currentDistTab === 'orders' ? 'active' : ''}" onclick="switchDistTab('orders')">推广订单 (${pendingOrders.length}待确认)</span>
          <span class="admin-tab ${currentDistTab === 'withdrawals' ? 'active' : ''}" onclick="switchDistTab('withdrawals')">提现申请 (${pendingWd.length}待处理)</span>
          <span class="admin-tab ${currentDistTab === 'settings' ? 'active' : ''}" onclick="switchDistTab('settings')">⚙ 系统设置</span>
        </div>
        <div id="dist-admin-list"></div>
      `;
      distContainer.innerHTML = html;
      renderDistributorList(distributors, orders, withdrawals);
    }

    function switchDistTab(tab) {
      currentDistTab = tab;
      loadDistributorData();
    }

    function renderDistributorList(distributors, orders, withdrawals) {
      const container = document.getElementById('dist-admin-list');
      if (!container) return;

      if (currentDistTab === 'settings') {
        // 加载分销 + 助力解锁配置
        Promise.all([
          api('/api/distributor/admin/config?key=' + ADMIN_KEY),
          api('/api/assist/admin/config?key=' + ADMIN_KEY)
        ]).then(([distData, assistData]) => {
          if (!distData.success || !distData.config) {
            container.innerHTML = '<div class="admin-empty">加载失败</div>';
            return;
          }
          const cfg = distData.config;
          const acfg = assistData.config || { unlockThreshold: 3 };
          container.innerHTML = `
            <div class="dist-admin-config">
              <h3>⚙ 分销系统配置</h3>
              <div class="dist-admin-config-row">
                <label>佣金比例</label>
                <input type="number" id="cfg-rate" value="${cfg.commissionRate}" step="0.05" min="0" max="1" />
                <div class="dist-admin-config-hint">当前：<span class="current">${Math.round(cfg.commissionRate * 100)}%</span>（输入 0~1 之间，如 0.3 = 30%）</div>
              </div>
              <div class="dist-admin-config-row">
                <label>最低提现（¥）</label>
                <input type="number" id="cfg-minwd" value="${cfg.minWithdrawal}" step="1" min="0" />
                <div class="dist-admin-config-hint">当前：<span class="current">¥${cfg.minWithdrawal}</span>（推广员提现门槛）</div>
              </div>
              <div id="cfg-save-msg" style="color:#66bb6a;font-size:0.8rem;margin-bottom:8px;"></div>
              <button class="btn-save-config" onclick="saveDistConfig()">保存分销配置</button>
            </div>
            <div class="dist-admin-config" style="margin-top:20px;">
              <h3>🔓 邀请助力解锁配置</h3>
              <div class="dist-admin-config-row">
                <label>解锁助力人数</label>
                <input type="number" id="cfg-unlock-threshold" value="${acfg.unlockThreshold}" step="1" min="1" max="99" />
                <div class="dist-admin-config-hint">当前：<span class="current">${acfg.unlockThreshold} 人</span>（用户需邀请多少位好友完成测试才能解锁完整报告）</div>
              </div>
              <div id="assist-cfg-save-msg" style="color:#66bb6a;font-size:0.8rem;margin-bottom:8px;"></div>
              <button class="btn-save-config" onclick="saveAssistConfig()">保存助力配置</button>
            </div>
          `;
        });
        return;
      }

      if (currentDistTab === 'distributors') {
        if (!distributors.length) {
          container.innerHTML = '<div class="admin-empty">暂无推广员</div>';
          return;
        }
        let html = `<div class="dist-admin-section"><h3>推广员列表</h3><table class="dist-admin-table">
          <tr><th>昵称</th><th>代码</th><th>微信号</th><th>推广</th><th>佣金</th><th>可提现</th><th>状态</th><th>注册时间</th></tr>`;
        distributors.forEach(d => {
          const confirmed = orders.filter(o => o.distributorUid === d.uid && o.status === 'confirmed').length;
          html += `<tr>
            <td>${escHtml(d.name)}</td>
            <td style="font-family:monospace;color:#f59e0b;">${d.code}</td>
            <td>${escHtml(d.wechat)}</td>
            <td>${d.totalReferrals || 0}</td>
            <td>¥${(d.totalCommission || 0).toFixed(1)}</td>
            <td>¥${(d.withdrawable || 0).toFixed(1)}</td>
            <td><span class="dist-admin-badge ${d.status}">${d.status === 'active' ? '正常' : '停用'}</span></td>
            <td style="font-size:0.6rem;">${new Date(d.createdAt).toLocaleDateString('zh-CN')}</td>
          </tr>`;
        });
        html += '</table></div>';
        container.innerHTML = html;
      } else if (currentDistTab === 'orders') {
        if (!orders.length) {
          container.innerHTML = '<div class="admin-empty">暂无推广订单</div>';
          return;
        }
        let html = `<div class="dist-admin-section"><h3>推广订单</h3><table class="dist-admin-table">
          <tr><th>客户</th><th>类型</th><th>佣金</th><th>状态</th><th>时间</th><th>操作</th></tr>`;
        orders.forEach(o => {
          html += `<tr>
            <td>${escHtml(o.customerName)}</td>
            <td>${o.orderType === 'premium' ? '付费' : '免费'}</td>
            <td>¥${(o.commission || 0).toFixed(2)}</td>
            <td><span class="dist-admin-badge ${o.status}">${o.status === 'pending' ? '待确认' : o.status === 'confirmed' ? '已结算' : '已取消'}</span></td>
            <td style="font-size:0.6rem;">${new Date(o.createdAt).toLocaleDateString('zh-CN')}</td>
            <td>
              ${o.status === 'pending' ? `
                <div class="dist-admin-actions">
                  <button class="dist-admin-btn confirm" onclick="confirmOrder('${o.id}')">确认</button>
                  <button class="dist-admin-btn cancel" onclick="cancelOrder('${o.id}')">取消</button>
                </div>
              ` : '<span style="color:#575a85;">--</span>'}
            </td>
          </tr>`;
        });
        html += '</table></div>';
        container.innerHTML = html;
      } else if (currentDistTab === 'withdrawals') {
        if (!withdrawals.length) {
          container.innerHTML = '<div class="admin-empty">暂无提现申请</div>';
          return;
        }
        let html = `<div class="dist-admin-section"><h3>提现申请</h3><table class="dist-admin-table">
          <tr><th>姓名</th><th>微信号</th><th>金额</th><th>状态</th><th>申请时间</th><th>备注</th><th>操作</th></tr>`;
        withdrawals.forEach(w => {
          html += `<tr>
            <td>${escHtml(w.name)}</td>
            <td>${escHtml(w.wechat)}</td>
            <td style="font-weight:600;">¥${(w.amount || 0).toFixed(2)}</td>
            <td><span class="dist-admin-badge ${w.status}">${w.status === 'pending' ? '待处理' : w.status === 'approved' ? '已打款' : '已拒绝'}</span></td>
            <td style="font-size:0.6rem;">${new Date(w.createdAt).toLocaleDateString('zh-CN')}</td>
            <td>${w.status === 'pending' ? `<input class="dist-admin-note-input" id="wd-note-${w.id}" placeholder="备注" />` : escHtml(w.note || '')}</td>
            <td>
              ${w.status === 'pending' ? `
                <div class="dist-admin-actions">
                  <button class="dist-admin-btn approve" onclick="handleWithdrawal('${w.id}', 'approve')">打款</button>
                  <button class="dist-admin-btn reject" onclick="handleWithdrawal('${w.id}', 'reject')">拒绝</button>
                </div>
              ` : '<span style="color:#575a85;">--</span>'}
            </td>
          </tr>`;
        });
        html += '</table></div>';
        container.innerHTML = html;
      }
    }

    async function confirmOrder(orderId) {
      const res = await api('/api/distributor/admin/confirm-order?key=' + ADMIN_KEY, {
        method: 'POST', body: JSON.stringify({ orderId })
      });
      if (res.success) {
        alert('佣金已发放');
        loadDistributorData();
      } else {
        alert(res.error || '操作失败');
      }
    }

    async function cancelOrder(orderId) {
      if (!confirm('确定取消此订单？')) return;
      const res = await api('/api/distributor/admin/cancel-order?key=' + ADMIN_KEY, {
        method: 'POST', body: JSON.stringify({ orderId })
      });
      if (res.success) {
        loadDistributorData();
      } else {
        alert(res.error || '操作失败');
      }
    }

    async function handleWithdrawal(withdrawalId, action) {
      const actionLabel = action === 'approve' ? '打款' : '拒绝';
      if (!confirm(`确定${actionLabel}此提现申请？`)) return;
      const noteInput = document.getElementById(`wd-note-${withdrawalId}`);
      const note = noteInput ? noteInput.value : '';
      const res = await api('/api/distributor/admin/handle-withdrawal?key=' + ADMIN_KEY, {
        method: 'POST', body: JSON.stringify({ withdrawalId, action, note })
      });
      if (res.success) {
        alert(`${actionLabel}成功`);
        loadDistributorData();
      } else {
        alert(res.error || '操作失败');
      }
    }

    async function saveAssistConfig() {
      const threshold = parseInt(document.getElementById('cfg-unlock-threshold')?.value, 10);
      const msgEl = document.getElementById('assist-cfg-save-msg');
      if (!msgEl) return;
      if (isNaN(threshold) || threshold < 1 || threshold > 99) {
        msgEl.textContent = '❌ 解锁人数需在 1~99 之间';
        return;
      }
      const res = await api('/api/assist/admin/config?key=' + ADMIN_KEY, {
        method: 'POST', body: JSON.stringify({ unlockThreshold: threshold })
      });
      if (res.success) {
        msgEl.textContent = '✅ 助力门槛已保存';
        setTimeout(() => { msgEl.textContent = ''; }, 3000);
      } else {
        msgEl.textContent = '❌ ' + (res.error || '保存失败');
      }
    }

    async function saveDistConfig() {
      const rate = parseFloat(document.getElementById('cfg-rate')?.value);
      const minWd = parseFloat(document.getElementById('cfg-minwd')?.value);
      const msgEl = document.getElementById('cfg-save-msg');
      if (!msgEl) return;

      const body = {};
      if (!isNaN(rate)) body.commissionRate = rate;
      if (!isNaN(minWd)) body.minWithdrawal = minWd;

      const res = await api('/api/distributor/admin/config?key=' + ADMIN_KEY, {
        method: 'POST', body: JSON.stringify(body)
      });
      if (res.success) {
        msgEl.textContent = '✅ 配置已保存';
        setTimeout(() => { msgEl.textContent = ''; }, 3000);
      } else {
        msgEl.textContent = '❌ ' + (res.error || '保存失败');
      }
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ========== 埋点统计 ==========
    async function loadTrackingStats() {
      const container = document.getElementById('tracking-content');
      if (!container) return;

      try {
        const res = await api('/api/track/stats?key=' + ADMIN_KEY + '&days=14');
        if (!res.success || !res.stats) {
          container.innerHTML = '<div class="track-empty">暂无数据</div>';
          return;
        }
        renderTrackingStats(container, res.stats);
      } catch {
        container.innerHTML = '<div class="track-empty">加载失败</div>';
      }
    }

    function renderTrackingStats(container, stats) {
      const { total, recent, pageViews, sectionViews, eventCounts, dailyActive } = stats;

      // 各分类 Top 10
      const pvTop = Object.entries(pageViews || {}).slice(0, 10);
      const svTop = Object.entries(sectionViews || {}).slice(0, 10);
      const evTop = Object.entries(eventCounts || {}).slice(0, 10);
      const daEntries = Object.entries(dailyActive || {});

      const maxPv = pvTop.length ? pvTop[0][1] : 1;
      const maxSv = svTop.length ? svTop[0][1] : 1;
      const maxEv = evTop.length ? evTop[0][1] : 1;
      const maxDa = daEntries.length ? Math.max(...daEntries.map(e => e[1])) : 1;

      // 计算唯一用户数（从原始数据近似：用 DAU 条目数 * 平均活跃度，简单处理）
      const avgDaily = daEntries.length ? Math.round(daEntries.reduce((s, e) => s + e[1], 0) / daEntries.length) : 0;

      const pageLabel = (p) => {
        const map = { home: '首页', form: '填信息', budget: '预算', loading: '加载', report: '报告页', distributor: '推广中心' };
        return map[p] || p;
      };
      const sectionLabel = (s) => s.length > 20 ? s.slice(0, 18) + '…' : s;
      const eventLabel = (e) => {
        const map = { page_view: '页面浏览', section_view: '板块浏览', app_load: '启动', share_image: '保存图片', click_share: '点击分享', click_wechat: '复制微信', click_talent: '查看天赋', report_generated: '生成报告', submit_comment: '发表评论', distributor_register: '推广注册', click_unlock: '点击解锁' };
        return map[e] || e;
      };
      const dayLabel = (d) => {
        const parts = d.split('-');
        return parts[1] + '/' + parts[2];
      };

      container.innerHTML = `
        <div class="track-grid">
          <div class="track-card">
            <h3>总事件数</h3>
            <div class="track-num">${total}</div>
          </div>
          <div class="track-card">
            <h3>近14天</h3>
            <div class="track-num">${recent}</div>
          </div>
          <div class="track-card">
            <h3>日均活跃</h3>
            <div class="track-num-small">${avgDaily}</div>
          </div>
          <div class="track-card">
            <h3>统计天数</h3>
            <div class="track-num-small">${stats.days || 7}天</div>
          </div>
        </div>

        <div class="track-grid">
          <div class="track-card">
            <h3>📄 页面浏览量 Top</h3>
            ${pvTop.length ? pvTop.map(([k, v]) => `
              <div class="track-bar-item">
                <span class="track-bar-label">${pageLabel(k)}</span>
                <div class="track-bar-bg"><div class="track-bar-fill page" style="width:${(v / maxPv * 100).toFixed(1)}%"></div></div>
                <span class="track-bar-count">${v}</span>
              </div>
            `).join('') : '<div class="track-empty">暂无</div>'}
          </div>

          <div class="track-card">
            <h3>🔍 板块浏览 Top</h3>
            ${svTop.length ? svTop.map(([k, v]) => `
              <div class="track-bar-item">
                <span class="track-bar-label" title="${escHtml(k)}">${sectionLabel(k)}</span>
                <div class="track-bar-bg"><div class="track-bar-fill section" style="width:${(v / maxSv * 100).toFixed(1)}%"></div></div>
                <span class="track-bar-count">${v}</span>
              </div>
            `).join('') : '<div class="track-empty">暂无</div>'}
          </div>

          <div class="track-card full">
            <h3>📊 事件分布</h3>
            ${evTop.length ? evTop.map(([k, v]) => `
              <div class="track-bar-item">
                <span class="track-bar-label">${eventLabel(k)}</span>
                <div class="track-bar-bg"><div class="track-bar-fill event" style="width:${(v / maxEv * 100).toFixed(1)}%"></div></div>
                <span class="track-bar-count">${v}</span>
              </div>
            `).join('') : '<div class="track-empty">暂无</div>'}
          </div>

          <div class="track-card full">
            <h3>📈 每日活跃趋势</h3>
            ${daEntries.length ? daEntries.map(([k, v]) => `
              <div class="track-day-row">
                <span class="track-day-label">${dayLabel(k)}</span>
                <div class="track-day-bg"><div class="track-day-fill" style="width:${(v / maxDa * 100).toFixed(1)}%"></div></div>
                <span class="track-day-count">${v}</span>
              </div>
            `).join('') : '<div class="track-empty">暂无</div>'}
          </div>
        </div>
      `;
    }

	    // 成绩检测记录
	    function loadGradeAssessments() {
	      const key = localStorage.getItem('admin_key') || document.getElementById('admin-key')?.value || '';
	      if (!key) return;
	      const area = document.getElementById('grade-content');
	      area.innerHTML = '<div class="admin-loading">加载中...</div>';
	      fetch('/api/grade-assessment/list?key=' + encodeURIComponent(key))
	        .then(r => r.json())
	        .then(data => {
	          if (!data.success) { area.innerHTML = '<div class="admin-empty">加载失败</div>'; return; }
	          if (!data.records || data.records.length === 0) { area.innerHTML = '<div class="admin-empty">暂无成绩检测记录</div>'; return; }
	          let html = '<div class="admin-stats"><div class="admin-stat"><div class="admin-stat-num">' + data.records.length + '</div><div class="admin-stat-label">总线索</div></div></div>';
	          data.records.forEach(r => {
	            const subjects = r.subjects ? r.subjects.join('、') : '';
	            const scoresHtml = r.scores ? Object.entries(r.scores).map(function(e) { return e[0] + ':' + e[1]; }).join(' | ') : '';
	            const distTag = r.distributor ? '<span style="color:#f59e0b;font-size:0.72rem;">🔗 ' + r.distributor + '</span>' : '';
	            const time = r.createdAt ? new Date(r.createdAt).toLocaleString('zh-CN') : '';
	            html += '<div class="admin-comment-item">'
	              + '<div class="admin-comment-meta">'
	              + '<span class="admin-comment-name">📱 ' + r.wechat + '</span>'
	              + '<span style="color:#66bb6a;font-size:0.78rem;">' + r.grade + '</span>'
	              + '</div>'
	              + '<div style="color:#8b8fbd;font-size:0.82rem;margin-bottom:6px;">📍 ' + (r.province || '') + ' | 📚 ' + subjects + '</div>'
	              + '<div style="color:#575a85;font-size:0.78rem;margin-bottom:4px;">' + scoresHtml + '</div>'
	              + '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">'
	              + '<span style="color:#575a85;font-size:0.7rem;">' + time + '</span>'
	              + distTag
	              + '</div>'
	              + (r.studentName ? '<div style="color:#8b8fbd;font-size:0.78rem;margin-top:4px;">👤 ' + r.studentName + '</div>' : '')
	              + '</div>';
	          });
	          area.innerHTML = html;
	        })
	        .catch(function() { area.innerHTML = '<div class="admin-empty">加载失败</div>'; });
	    }
	  
    // ========== 用户测试记录 ==========
    async function loadUserRecords() {
      const key = localStorage.getItem('admin_key') || document.getElementById('admin-key')?.value || '';
      if (!key) return;
      const area = document.getElementById('records-content');
      area.innerHTML = '<div class="admin-loading">加载中...</div>';
      try {
        const res = await fetch('/api/user-records/list?key=' + encodeURIComponent(key));
        const data = await res.json();
        if (!data.success || !data.records || data.records.length === 0) {
          area.innerHTML = '<div class="admin-empty">暂无用户记录</div>';
          return;
        }
        let stats = { star: 0, grade: 0, mbti: 0 };
        data.records.forEach(r => { if (stats[r.type] !== undefined) stats[r.type]++; });
        let html = '<div class="admin-stats">'
          + '<div class="admin-stat"><div class="admin-stat-num">' + data.records.length + '</div><div class="admin-stat-label">总记录</div></div>'
          + '<div class="admin-stat"><div class="admin-stat-num">' + stats.star + '</div><div class="admin-stat-label">星盘解读</div></div>'
          + '<div class="admin-stat"><div class="admin-stat-num">' + stats.grade + '</div><div class="admin-stat-label">成绩检测</div></div>'
          + '</div>';
        data.records.forEach(r => {
          const time = r.createdAt ? new Date(r.createdAt).toLocaleString('zh-CN') : '';
          const distTag = r.distributor ? '<span style="color:#f59e0b;font-size:0.72rem;">🔗 ' + r.distributor + '</span>' : '';
          if (r.type === 'star') {
            html += '<div class="admin-comment-item">'
              + '<div class="admin-comment-meta">'
              + '<span class="admin-comment-name">🌟 星盘 · ' + escHtml(r.name || '匿名') + '</span>'
              + '<span style="color:#818cf8;font-size:0.78rem;">' + time + '</span>'
              + '</div>'
              + '<div style="color:#8b8fbd;font-size:0.82rem;margin-bottom:4px;">📅 ' + (r.birthDate || '') + ' | ' + (r.city || '未选择城市') + '</div>'
              + '<div style="font-size:0.78rem;color:#575a85;">'
              + (r.budget ? '💰 ' + r.budget : '') + (r.budget && r.grade ? ' | ' : '') + (r.grade ? '📊 ' + r.grade : '')
              + '</div>'
              + '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">'
              + '<span style="color:#575a85;font-size:0.7rem;">' + time + '</span>'
              + distTag
              + '</div>'
              + '</div>';
          } else if (r.type === 'grade') {
            const subjects = r.subjects ? r.subjects.join('、') : '';
            const scoresHtml = r.scores ? Object.entries(r.scores).map(function(e) { return e[0] + ':' + e[1]; }).join(' | ') : '';
            html += '<div class="admin-comment-item">'
              + '<div class="admin-comment-meta">'
              + '<span class="admin-comment-name">📱 成绩检测 · ' + escHtml(r.wechat || '') + '</span>'
              + '<span style="color:#66bb6a;font-size:0.78rem;">' + (r.grade || '') + '</span>'
              + '</div>'
              + '<div style="color:#8b8fbd;font-size:0.82rem;margin-bottom:6px;">📍 ' + (r.province || '') + ' | 📚 ' + subjects + '</div>'
              + '<div style="color:#575a85;font-size:0.78rem;margin-bottom:4px;">' + scoresHtml + '</div>'
              + '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">'
              + '<span style="color:#575a85;font-size:0.7rem;">' + time + '</span>'
              + distTag
              + '</div>'
              + (r.studentName ? '<div style="color:#8b8fbd;font-size:0.78rem;margin-top:4px;">👤 ' + escHtml(r.studentName) + '</div>' : '')
              + '</div>';
          }
        });
        area.innerHTML = html;
      } catch(e) {
        area.innerHTML = '<div class="admin-empty">加载失败</div>';
      }
    }

  </script>
</head>
<body>
  <div class="admin-page">
    <div class="admin-header">
      <h1>🔐 劲脑·天赋探测仪管理后台</h1>
    </div>

    <div id="login-form" class="admin-login">
      <p style="color:#9a97b0;margin-bottom:12px;">请输入管理员密钥</p>
      <input type="password" id="admin-key" placeholder="管理员密钥" onkeydown="if(event.key==='Enter')login()" />
      <button onclick="login()">登录</button>
      <p id="login-error" style="color:#ef5350;margin-top:8px;font-size:0.8rem;"></p>
    </div>

    <div id="admin-panel" style="display:none;">
      <div class="admin-tabs">
        <span class="admin-tab active" data-tab="pending" onclick="setTab('pending')">⏳ 待审核</span>
        <span class="admin-tab" data-tab="approved" onclick="setTab('approved')">✅ 已通过</span>
        <span class="admin-tab" data-tab="all" onclick="setTab('all')">📋 全部</span>
        <span class="admin-tab dist" data-tab="dist" onclick="setTab('dist')">💰 分销</span>
        <span class="admin-tab" data-tab="tracking" onclick="setTab('tracking')">📊 埋点</span>
	        <span class="admin-tab" data-tab="grade" onclick="setTab('grade')">📝 成绩检测</span>
	        <span class="admin-tab" data-tab="records" onclick="setTab('records')">👤 用户记录</span>
	        <span class="admin-tab" data-tab="records" onclick="setTab('records')">👤 用户记录</span>
      </div>

      <!-- 评论管理 -->
      <div id="comment-area">
        <div class="admin-stats">
          <div class="admin-stat"><div class="admin-stat-num" id="stat-pending">0</div><div class="admin-stat-label">待审核</div></div>
          <div class="admin-stat"><div class="admin-stat-num" id="stat-approved">0</div><div class="admin-stat-label">已通过</div></div>
          <div class="admin-stat"><div class="admin-stat-num" id="stat-total">0</div><div class="admin-stat-label">全部</div></div>
        </div>
        <div id="comment-list"></div>
      </div>

      <!-- 分销管理 -->
      <div id="dist-admin-content" style="display:none;"></div>

      <!-- 埋点统计 -->
      <div id="tracking-content" style="display:none;"></div>

	      <!-- 成绩检测记录 -->
	      <div id="grade-content" style="display:none;"></div>

	      <!-- 用户测试记录 -->
	      <div id="records-content" style="display:none;"></div>
    </div>
  </div>
  <script>
    // 切换显示评论/分销/埋点区域
    const origSetTab = setTab;
    setTab = function(tab) {
      origSetTab(tab);
      const commentArea = document.getElementById('comment-area');
      const distArea = document.getElementById('dist-admin-content');
      const trackArea = document.getElementById('tracking-content');
      commentArea.style.display = (tab === 'dist' || tab === 'tracking' || tab === 'grade' || tab === 'records') ? 'none' : 'block';
      distArea.style.display = tab === 'dist' ? 'block' : 'none';
      trackArea.style.display = tab === 'tracking' ? 'block' : 'none';
	      const recordsArea = document.getElementById('records-content');
	      recordsArea.style.display = tab === 'records' ? 'block' : 'none';
	      const gradeArea = document.getElementById('grade-content');
	      gradeArea.style.display = tab === 'grade' ? 'block' : 'none';
      if (tab === 'tracking') loadTrackingStats();
	      if (tab === 'grade') loadGradeAssessments();
	      if (tab === 'records') loadUserRecords();
    };
  </script>
</body>
</html>
