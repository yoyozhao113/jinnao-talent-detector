<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <title>优势星测 — 发现孩子的天赋密码</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style-v2.css" />
</head>
<body>
  <div id="app">
    <!-- ====== Step1: 首页 ====== -->
    <section id="page-home" class="page active">
      <div class="home-hero">
        <div class="hero-stars" aria-hidden="true">
          <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
          <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>
        </div>
        <div class="hero-badge">✦ 科学 × 星象</div>
        <h1 class="hero-title">优势星测</h1>
        <p class="hero-subtitle">读懂天赋，点亮成长之路</p>
        <p class="hero-desc">基于瑞士星历表 · AI 深度解读 · 已服务 1,000+ 家庭</p>
      </div>

      <div class="home-cards">
        <!-- 性格优势 -->
        <div class="home-card" onclick="goToStep2('strength')">
          <div class="home-card-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 3 2 5 7 9 5-4 7-6 7-9a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2"/></svg>
          </div>
          <div class="home-card-body">
            <h3>性格优势测试<span class="tag tag--hot">HOT</span></h3>
            <p>15 道题，AI 深度分析核心性格优势</p>
          </div>
          <div class="home-card-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <!-- 星盘解读 -->
        <div class="home-card" onclick="goToStep2('star')">
          <div class="home-card-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4m10-10h-4M6 12H2m15.07-5.07l-2.83 2.83M9.76 14.24l-2.83 2.83m11.14 0l-2.83-2.83M9.76 9.76L6.93 6.93"/></svg>
          </div>
          <div class="home-card-body">
            <h3>星盘天赋解读<span class="tag tag--pro">专业</span></h3>
            <p>输入出生信息，生成专属星盘 + 解读报告</p>
          </div>
          <div class="home-card-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
        <!-- 五行天赋 -->
        <div class="home-card" onclick="showTalentConsult()">
          <div class="home-card-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <div class="home-card-body">
            <h3>五行天赋测评<span class="tag tag--new">NEW</span></h3>
            <p>后天大脑优势训练 · 五行天赋培养方案</p>
          </div>
          <div class="home-card-arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
          </div>
        </div>
      </div>

      <div class="home-footer">
        <span>已服务 1,000+ 用户</span>
        <a href="/admin.html" class="admin-link">管理</a>
      </div>
    </section>

    <!-- ====== Step2: 信息填写 ====== -->
    <section id="page-form" class="page">
      <div class="topbar">
        <button class="btn-ghost" onclick="goHome()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5m0 0l7 7m-7-7l7-7"/></svg>
          返回
        </button>
        <span class="step-tag">Step 2 / 3</span>
      </div>
      <div id="form-content"><!-- JS 渲染 --></div>
    </section>

    <!-- ====== 选填信息 ====== -->
    <section id="page-budget" class="page">
      <div class="topbar">
        <button class="btn-ghost" onclick="backFromBudget()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5m0 0l7 7m-7-7l7-7"/></svg>
          返回
        </button>
        <span class="step-tag">选填信息</span>
      </div>
      <div id="budget-content"></div>
    </section>

    <!-- ====== 加载 ====== -->
    <section id="page-loading" class="page">
      <div class="loading-wrap">
        <div class="loading-ring">
          <div class="ring-segment r1"></div>
          <div class="ring-segment r2"></div>
          <div class="ring-segment r3"></div>
        </div>
        <p class="loading-title" id="loading-text">AI 分析中…</p>
        <p class="loading-sub" id="loading-hint">正在生成专属报告</p>
      </div>
    </section>

    <!-- ====== 报告页 ====== -->
    <section id="page-report" class="page">
      <div class="topbar topbar--report">
        <button class="btn-ghost" onclick="goHome()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
          首页
        </button>
      </div>

      <!-- 星盘报告 -->
      <div id="star-report-area" class="hidden">
        <div class="report-hero">
          <div class="report-version" id="report-badge">免费版</div>
          <h2 class="report-title" id="report-title">宝贝的专属星盘解读</h2>
          <p class="report-meta" id="report-summary">太阳：— · 月亮：— · 上升：—</p>
          <p class="report-method">Placidus 宫位制 · 瑞士星历表</p>
        </div>

        <div class="chart-canvas-wrap">
          <canvas id="chart-wheel"></canvas>
        </div>

        <!-- 相位弹窗 -->
        <dialog id="aspect-modal" class="modal">
          <div class="modal-head">
            <span class="modal-title">相位表</span>
            <button class="modal-close" onclick="closeAspectModal()" aria-label="关闭">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
          <div id="aspect-modal-body" class="modal-body"></div>
        </dialog>

        <div id="report-content" class="report-body"></div>
        <div id="report-footer" class="report-footer"></div>

        <div class="report-actions">
          <button class="btn-outline" onclick="window.shareReport()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            分享
          </button>
          <button class="btn-outline" onclick="window.backToForm()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 105.64-11.36L1 10"/></svg>
            重新解读
          </button>
        </div>
      </div>

      <!-- 性格测试报告 -->
      <div id="strength-report-area" class="hidden">
        <div class="strength-result" id="strength-result"></div>
      </div>
    </section>
  </div>

  <script type="module" src="/src/main.js?v=5"></script>
</body>
</html>
