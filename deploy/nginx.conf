# 优势星测 · Nginx 生产配置
# 使用方式：
#   1. 将本文件上传到服务器 /etc/nginx/sites-available/star-mom-astrology
#   2. ln -s /etc/nginx/sites-available/star-mom-astrology /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name yoyoxingsujia.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yoyoxingsujia.cn;

    # SSL 证书（使用 certbot 申请）
    ssl_certificate     /etc/letsencrypt/live/yoyoxingsujia.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yoyoxingsujia.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 项目根目录（dist 为 Vite 构建产物）
    root /var/www/star-mom-astrology/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 超时设置（DeepSeek 可能耗时 15s+）
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # 管理后台（独立 HTML，不经过 Vite 构建）
    location /admin.html {
        alias /var/www/star-mom-astrology/dist/admin.html;
    }

    # 静态资源缓存（JS/CSS 带 hash，可长期缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由 fallback（非文件、非 API 的请求返回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问敏感文件
    location ~ /\. {
        deny all;
    }
    location ~ \.(json|log)$ {
        deny all;
    }
}
